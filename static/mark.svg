<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="grepm">
  <title>grepm</title>
  <!--
    The app's mark, and the single source for both the generated icons in
    src-tauri/icons/ and the image the reader shows when nothing is selected.
    Regenerate the icons with `npx tauri icon static/mark.svg` after editing.

    Colours are the app's own palette, hard-coded because this file is also
    rasterised outside the browser, where CSS custom properties don't exist:
    #242526 is surface-raised, #e4e6eb is text, #0a7cff is accent. (Naming
    those tokens with their real leading double dash would be an XML syntax
    error inside a comment, which is worth knowing before editing this.)

    The bubble's proportions were measured off a reference rather than
    guessed: an ellipse a touch wider than tall (85 x 80 here, a 1.06 ratio),
    with a tail hanging off the bottom-left whose left edge is *vertical* and
    tangent to the ellipse — only its right edge angles back in. A symmetric
    triangle tail reads as a separate spike stuck on the side; this reads as
    part of the same shape.

    It is a plain speech bubble, not Facebook's mark: the lightning bolt that
    makes theirs distinctive is deliberately absent.
  -->
  <rect width="512" height="512" rx="112" fill="#242526"/>

  <circle cx="222" cy="222" r="130" fill="none" stroke="#e4e6eb" stroke-width="34"/>
  <path d="M320 320 L424 424" fill="none" stroke="#e4e6eb" stroke-width="44" stroke-linecap="round"/>

  <g fill="#0a7cff">
    <ellipse cx="221" cy="216" rx="85" ry="80"/>
    <path d="M167 278 L167 309 L205 288 Z"/>
  </g>
</svg>
