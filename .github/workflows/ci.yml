name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first; no point finishing the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The engine is where the code and the tests are, so this job is the one
  # that has to stay fast — it deliberately skips the Tauri dependency tree.
  engine:
    name: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting needs no dependencies, so cover both crates here rather
      # than paying for it again in the app job.
      - name: Format
        run: cargo fmt --all --check

      # The other half of the line-length convention. rustfmt can't do this
      # one on stable, so without a step here the rule holds only on the
      # machines that happen to run the PostToolUse hook.
      - name: Comment width
        run: ./scripts/check-comment-width.sh

      # `--locked` fails if Cargo.lock would need updating, so CI can't
      # silently resolve versions that differ from a local build.
      - name: Lint
        run: cargo clippy --locked -p grepm_core --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -p grepm_core

  # The desktop shell is still scaffold, so this only type-checks it. Its
  # job is to catch a `grepm_core` change that breaks its one consumer.
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --locked -p grepm --all-targets -- -D warnings

  # The SvelteKit front end. Independent of the Rust jobs — it needs no cargo
  # and no Tauri system libraries, because the tests stub the IPC bridge
  # rather than launching the desktop app.
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile is out of sync — the npm equivalent of cargo's `--locked`.
      - name: Install
        run: npm ci

      # Browser-mode tests need a real Chromium. Keyed on the lockfile so the
      # cache is invalidated whenever the pinned playwright version moves.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
